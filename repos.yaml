# repos.yaml v0 — see github.com/adamtpang/repo-connect
repo: pangaea.blog
is: Personal essay site and hub for the life loop. Two pillars live here directly (1000 essays via ESSAYS-1000.md, 1000 apps via src/content/apps/); the third, songs, spun out into its own repo.
cluster: 1000-life-loop

provides:
  - id: apps-pillar
    what: The "1000 apps" content collection, already a working home for every app/project Adam has shipped or is building, no separate repo needed for this pillar
    at: src/content/apps/
  - id: essays-pillar
    what: The 1000-essays framework and progress tracking
    at: ESSAYS-1000.md

stack: [astro, typescript]

kin:
  - repo: strummer.fun
    why: The songs pillar of the same three-pillar life loop (essays and apps live here, songs lives there). Migrated out to strummer.fun-songs on 2026-08-08 so the songs pipeline could ship as its own site, then folded into strummer.fun/songs/ on 2026-08-09 when strummer.fun-songs was retired.
  - repo: thedojo.fun
    why: thedojo.fun (renamed from "ships" on 2026-08-09 to match its live domain) is the chosen home for the apps pillar going forward, replacing vercel.school in that role. The apps pillar here (src/content/apps/) is hand-maintained markdown; whether it migrates to thedojo.fun the way songs migrated is an open question, not yet decided.
  - repo: podcast-pipeline
    why: This site's own CLAUDE.md names /podcast as the spoken-word pillar (Pangaea is a hub for the spoken AND the written word, /posts is the writing, /podcast is the spoken side, YouTube-hosted episodes), parallel to how strummer.fun is kin for the songs pillar. podcast-pipeline is the actual production tool for that spoken pillar: it transcribes, cuts, and packages the Time Capsule episodes /podcast is meant to host. Not yet wired into a provides/at path here since /podcast has no dedicated content collection yet, this edge names the relationship ahead of that build-out.
