# repos.yaml v0 — see github.com/adamtpang/repo-connect
repo: pangaea.blog
is: Personal essay site and hub for the life loop. Two pillars live here directly (1000 essays via ESSAYS-1000.md, 1000 apps via src/content/apps/); songs and games each spun out into their own repo.
cluster: 1000-life-loop
canon: ECOSYSTEM.md

provides:
  - id: apps-pillar
    what: The "1000 apps" content collection, already a working home for every app/project Adam has shipped or is building, no separate repo needed for this pillar
    at: src/content/config.ts
  - id: essays-pillar
    what: The 1000-essays framework and progress tracking
    at: ESSAYS-1000.md
  - id: daily-capture
    what: The daily 300-word writing surface (speak or type, live word-count, streak tracking, AI polish via /api/daily/polish, send-to-/write). The product 300words.app was consolidated into on 2026-08-02.
    at: src/pages/daily.astro

stack: [astro, typescript]

kin:
  - repo: strummer.fun
    why: The songs pillar of the same three-pillar life loop (essays and apps live here, songs lives there). Migrated out to strummer.fun-songs on 2026-08-08 so the songs pipeline could ship as its own site, then folded into strummer.fun/songs/ on 2026-08-09 when strummer.fun-songs was retired.
  - repo: thedojo.fun
    why: thedojo.fun (renamed from "ships" on 2026-08-09 to match its live domain) is the chosen home for the apps pillar going forward, replacing vercel.school in that role. The apps pillar here (src/content/apps/) is hand-maintained markdown; whether it migrates to thedojo.fun the way songs migrated is an open question, not yet decided.
  - repo: footage.center
    why: pangaea.blog owns approved public Time Capsule episode pages and show notes. footage.center owns the private production ledger, source assets, cuts, consent gates, final QA, and delivery packages for the five recorded episodes.
  - repo: eyeland.cards
    why: A fourth 1000-life-loop pillar, "1000 games" (speedrun-built games), named by Adam on 2026-08-10 alongside the existing essays/songs/apps pillars. Now has its own GAMES-1000.md tracking file (same convention as ESSAYS-1000.md here), 2 entries shipped as of 2026-08-10.
  - repo: wonderhall.live
    why: Cataloged as project #33 in the apps pillar here (src/content/apps/wonderhall-live.md) — one of the shipped apps this pillar exists to house.
  - repo: 300words.app
    why: The origin product for the daily-capture pillar (see provides.daily-capture above). Consolidated in here on 2026-08-02 so capture (speak/type 300 words at /daily) and publish (essays via /write) share one codebase and one design system. 300words.app is now just the marketing landing page and domain; its /app route 308-redirects to /daily here.
  - repo: pokedex.life
    why: pokedex.life's own CLAUDE.md names this site directly as the vehicle for its "hunt" mode ("The vehicle is pangaea.blog (remote podcasts - interview your way up; each guest is a warm-intro node toward the next tier)", see pokedex.life/docs/the-hunt.md). pokedex.life's targeting engine decides WHO to reach (the greatest living humans, laddered bottom-up via warm-intro paths); /podcast here is HOW that reach actually happens, one interview at a time. The footage.center edge above owns production; this edge is about who gets invited on.

exchanges:
  - id: package-reviewed-episode
    with: footage.center
    trigger: manual
    asks: package one human-reviewed podcast source for the publishing lane
    returns: consent-aware transcript cuts title description chapters final assets and explicit publish blockers
    permission: propose-change
    approval: human-required
    at: CLAUDE.md
