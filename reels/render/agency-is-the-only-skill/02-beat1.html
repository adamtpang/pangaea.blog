<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600&display=swap" />
<style>
  :root {
    --paper: #fbf7f0;
    --ink: #1c1917;
    --ink-soft: #403a34;
    --accent: #b34a2f;
    --gold: #8a6d34;
    --display: 'Fraunces', Georgia, serif;
    --serif: 'Newsreader', Georgia, serif;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: var(--paper);
    font-family: var(--serif);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    padding: 100px 96px;
  }
  .bar { width: 90px; height: 6px; background: var(--accent); border-radius: 3px; margin-bottom: 56px; }
  .claim {
    font-family: var(--display);
    font-weight: 480;
    font-size: 76px;
    line-height: 1.18;
    color: var(--ink);
    text-align: center;
    max-width: 880px;
  }
  .foot {
    position: absolute;
    bottom: 96px;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="claim" id="claim">Same resume.<br>Different decade.</div>
  <div class="foot">Pangaea &middot; Agency Is the Only Skill</div>
</body>
</html>
